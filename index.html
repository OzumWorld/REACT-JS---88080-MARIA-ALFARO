<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2d36" />
    <meta name="description" content="Pastas y barbotinas Arcillas Chilavert. Armá tu pedido y coordiná el retiro por WhatsApp." />
    <title>Arcillas Argentinas | Pastas y barbotinas</title>
    <script>
      (function (location) {
        if (location.search.startsWith("?/")) {
          var route = location.search.slice(2).split("&").map(function (part) {
            return part.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(null, "", location.pathname.replace(/\/$/, "") + "/" + route + location.hash);
        }
      }(window.location));
    </script>

  </body>
